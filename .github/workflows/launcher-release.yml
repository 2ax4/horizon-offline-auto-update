name: launcher-release
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (empty means the triggering ref)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

env:
  HORIZON_TELEMETRY_URL: "off"

jobs:
  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            asset: horizon-launcher-windows-x64.zip
            binary: horizon-launcher.exe
            rustflags: -C target-feature=+crt-static
          - name: linux
            os: ubuntu-22.04
            asset: horizon-launcher-linux-x86_64.tar.gz
            binary: horizon-launcher
          - name: macos
            # macos-26 arm64: the macos-15 arm64 hosted pool is chronically congested
            os: macos-26
            asset: horizon-launcher-macos-arm64.zip
            binary: horizon-launcher
          - name: macos-x64
            # Build x64 natively on the Intel hosted runner: it queues far faster
            os: macos-15-intel
            asset: horizon-launcher-macos-x64.zip
            binary: horizon-launcher
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    defaults:
      run:
        working-directory: launcher
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Embed the release version and tag into the build
        run: |
          raw="${{ inputs.ref }}"
          [ -n "$raw" ] || raw="${GITHUB_REF_NAME}"
          echo "RELEASE_TAG=$raw" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_TAG=$raw" >> "$GITHUB_ENV"
          echo "HORIZON_LAUNCHER_VERSION=${raw#launcher@}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          shared-key: launcher-${{ matrix.name }}

      - name: Linux libraries GPUI links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev libfontconfig-dev libvulkan-dev libasound2-dev patchelf

      - name: Binary directory
        run: |
          dir=target/release
          [ -z "${{ matrix.target }}" ] || dir="target/${{ matrix.target }}/release"
          echo "BIN_DIR=$dir" >> "$GITHUB_ENV"

      - name: Metal shaders at run time without the Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun metal --version > /dev/null 2>&1; then
            echo "LAUNCHER_FEATURES=gpui/runtime_shaders" >> "$GITHUB_ENV"
          fi

      - name: Tests
        if: runner.os != 'macOS'
        env:
          # The test rewrites docs/launcher-commands.md itself; the fork cannot regenerate it here
          HORIZON_WRITE_DOCS: "1"
        run: |
          set +e
          cargo test --release --locked --no-fail-fast -- --skip platform_assets_are_published 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### cargo test failed (exit $status) on ${{ matrix.name }}"
              echo
              echo "<details open><summary>Which tests failed</summary>"
              echo
              echo '```'
              grep -E '^test .* FAILED$|^error(\[E[0-9]+\])?: |^error: could not compile' test.log | sort -u | head -40
              echo '```'
              echo '</details>'
              echo
              echo "<details open><summary>Full failure report — the panic messages say exactly what broke</summary>"
              echo
              echo '```'
              sed -n '/^failures:$/,/^test result:/p' test.log | head -300
              echo '```'
              echo '</details>'
              echo
              echo "<details><summary>Last 120 lines of the whole test log</summary>"
              echo
              echo '```'
              tail -120 test.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
            # || true: a no-match grep must not abort under pipefail before exit "$status"
            grep -E '^test .* FAILED$|^error(\[E[0-9]+\])?: ' test.log | sort -u | head -10 \
              | while IFS= read -r line; do echo "::error title=cargo test (${{ matrix.name }})::${line}"; done || true
            grep -A 3 'panicked at ' test.log | grep -v '^--$' | sort -u | head -20 \
              | while IFS= read -r line; do echo "::error title=panic detail (${{ matrix.name }})::$(printf '%s' "$line" | head -c 250)"; done || true
          fi
          exit "$status"

      - name: Upload the test log (failure diagnostics)
        if: failure() && hashFiles('launcher/test.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: test-log-${{ matrix.name }}
          path: launcher/test.log
          retention-days: 14

      - name: Build
        run: |
          set +e
          cargo build --release --locked ${LAUNCHER_FEATURES:+--features "$LAUNCHER_FEATURES"} ${{ matrix.target && format('--target {0}', matrix.target) || '' }} 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "### cargo build failed (exit $status) on ${{ matrix.name }}"
              echo
              echo '```'
              grep -E '^error(\[E[0-9]+\])?: |^error: could not compile' -A 5 build.log | head -150
              echo '```'
              echo
              echo "<details><summary>Last 100 lines of the build log</summary>"
              echo
              echo '```'
              tail -100 build.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Upload the build log (failure diagnostics)
        if: failure() && hashFiles('launcher/build.log') != ''
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.name }}
          path: launcher/build.log
          retention-days: 14

      - name: Version check
        run: |
          out=$("$BIN_DIR/${{ matrix.binary }}" --version)
          echo "$out"
          [[ "$out" == "horizon-launcher $HORIZON_LAUNCHER_VERSION" ]] || {
            echo "::error::expected: horizon-launcher $HORIZON_LAUNCHER_VERSION"
            exit 1
          }

      - name: Smoke the offline account flow (add, list, forget)
        env:
          # A data folder of the smoke's own: judged on a fresh directory, never on runner state
          HORIZON_LAUNCHER_HOME: ${{ runner.temp }}/offline-smoke
        run: |
          set -e
          bin="$BIN_DIR/${{ matrix.binary }}"
          # Git Bash on Windows hands `${{ runner.temp }}` over with backslashes.
          home="${HORIZON_LAUNCHER_HOME//\\//}"
          rm -rf "$home"
          mkdir -p "$home"
          export HORIZON_LAUNCHER_HOME="$home"
          # accounts.json sits directly in $home; on failure the folder lands in the run summary
          dump() {
            {
              echo "### offline smoke failed"
              echo
              echo "- failed command: \`$*\`"
              echo "- smoke data folder: \`$home\`"
              echo
              echo "<details open><summary>What the folder held</summary>"
              echo
              echo '```'
              ls -la "$home" 2>&1 || true
              echo '```'
              echo '</details>'
              echo
              echo "<details open><summary>accounts.json</summary>"
              echo
              echo '```'
              cat "$home/accounts.json" 2>&1 || true
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          run() {
            if ! "$@"; then
              dump "$@"
              echo "::error title=offline smoke::$* failed (see the run summary)"
              exit 1
            fi
          }
          # Plain grep -F on the launcher's pretty JSON: python3 on Windows can be the Store alias
          list() { "$bin" --json account list; }
          expect() {
            local pattern=$1 label=$2 out
            if ! out=$(list); then
              dump "--json account list"
              echo "::error title=offline smoke::account list failed (see the run summary)"
              exit 1
            fi
            printf '%s\n' "$out"
            if ! printf '%s\n' "$out" | grep -qF -- "$pattern"; then
              {
                echo "### offline smoke failed: $label"
                echo
                echo '```json'
                printf '%s\n' "$out"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error title=offline smoke::$label"
              exit 1
            fi
          }
          run "$bin" account offline __SmokeTest__
          expect '"name": "__SmokeTest__"' "offline account missing after add"
          expect '"selected": true' "nothing plays after add"
          run "$bin" account forget-offline __SmokeTest__
          if ! out=$(list); then
            dump "--json account list"
            echo "::error title=offline smoke::account list failed (see the run summary)"
            exit 1
          fi
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -qF '"__SmokeTest__"'; then
            {
              echo "### offline smoke failed: the account is still listed after forget"
              echo
              echo '```json'
              printf '%s\n' "$out"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=offline smoke::still listed after forget"
            exit 1
          fi
          echo "offline account add + list + forget: OK"

      - name: Package
        run: |
          rm -rf dist out && mkdir -p dist out
          cp "$BIN_DIR/${{ matrix.binary }}" dist/
          case "${{ matrix.asset }}" in
            *.zip) if [ "${{ runner.os }}" = "Windows" ]; then
                     (cd dist && 7z a ../out/${{ matrix.asset }} ${{ matrix.binary }})
                   else
                     (cd dist && zip -q ../out/${{ matrix.asset }} ${{ matrix.binary }})
                   fi ;;
            *.tar.gz) (cd dist && tar czf ../out/${{ matrix.asset }} ${{ matrix.binary }}) ;;
          esac
          if [[ "${{ matrix.asset }}" == *.tar.gz ]]; then
            ../packaging/linux/appimage.sh "$BIN_DIR/${{ matrix.binary }}" "$HORIZON_LAUNCHER_VERSION" out
          fi
          ls -l out

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: launcher/out/*
          retention-days: 3

  sign:
    name: sign
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          sparse-checkout: tools/ci/sign_release.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: horizon-launcher-*
          merge-multiple: true

      - name: Signing key present
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          [ -n "$RELEASE_SIGNING_KEY" ] || {
            echo "::error::RELEASE_SIGNING_KEY private key is missing: add it under Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          }

      - name: Sign the checksums (SHA256SUMS, SHA256SUMS.sig)
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: bash tools/ci/sign_release.sh "$RELEASE_TAG" dist/horizon-launcher-*

      - name: Print the signing diagnostics
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          printf '%s' "$RELEASE_SIGNING_KEY" | base64 --decode \
            | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64
          cat dist/SHA256SUMS
          wc -c dist/SHA256SUMS.sig

      - uses: actions/upload-artifact@v7
        with:
          name: signature
          path: dist/SHA256SUMS*
          if-no-files-found: error
          retention-days: 3

  release:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the signature (the same way the launcher does)
        run: |
          git rev-parse HEAD
          cat crates/horizon-release-sign/release-keys.txt
          ls -la dist
          cargo run --locked --quiet -p horizon-release-sign -- verify --tag "$RELEASE_TAG" dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${RELEASE_TAG#launcher@}"
          ver="${ver%-offline}"
          body_file="$(mktemp)"
          up_body="$(gh release view "launcher@${ver}" -R horizon-rust/horizon --json body -q .body 2>/dev/null \
            || gh release view "launcher-v${ver}" -R horizon-rust/horizon --json body -q .body 2>/dev/null \
            || true)"
          # Same inputs as auto-offline-release.yml's phash: a changed patch set rebuilds instead of skipping
          phash=$(cat offline/patches/*.patch offline/lang-sync.py offline/lang-overrides.json .github/workflows/launcher-release.yml | sha256sum | cut -c1-8)
          {
            echo "Includes offline account support that does not need a Microsoft account. Based on ${ver}"
            echo "offline-phash:${phash}"
            echo
            printf '%s\n' "$up_body"
          } > "$body_file"
          # GitHub sometimes answers 500 ("Internal server error") mid-publish.
          # Retry: delete whatever partial release exists, then create again.
          published=false
          for attempt in 1 2 3; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --yes || true
            fi
            if gh release create "$RELEASE_TAG" \
              --title "Horizon launcher ${RELEASE_TAG#launcher@}" \
              --notes-file "$body_file" \
              dist/*
            then
              published=true
              break
            fi
            if [ "$attempt" != 3 ]; then
              echo "::warning::gh release create failed (attempt ${attempt}/3); GitHub may be having a transient issue, retrying in 30s"
              sleep 30
            fi
          done
          if [ "$published" != true ]; then
            echo "::error::could not publish the release after 3 attempts: GitHub kept returning errors. The next scheduled run rebuilds and retries automatically."
            exit 1
          fi
          rm -f "$body_file"
