name: auto-offline-release
on:
  schedule:
    # upstream check twice an hour, off the crowded :00/:30 minutes
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      retry:
        description: 'Retry versions that already failed with these patches'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: auto-offline-release
  cancel-in-progress: false

jobs:
  sync:
    name: upstream check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      should_build: ${{ steps.pick.outputs.should_build }}
      tag: ${{ steps.pick.outputs.tag }}
      marker: ${{ steps.pick.outputs.marker }}
      sha: ${{ steps.pick.outputs.sha }}
      alert: ${{ steps.pick.outputs.alert }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the newest upstream release the patches apply to
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RETRY: ${{ inputs.retry || github.event_name == 'push' }}
        run: |
          set -euo pipefail
          git config user.name "2ax4"
          git config user.email "2ax4@users.noreply.github.com"
          gh api 'repos/horizon-rust/horizon/releases?per_page=100' \
            --jq '[.[] | select(.draft == false) | select(.tag_name | test("^launcher[@-]v?[0-9]"))][].tag_name' \
            | sed 's/^launcher@//; s/^launcher-v//' \
            | grep -E '^[0-9][0-9A-Za-z._-]*$' > /tmp/versions.txt || true
          if [ ! -s /tmp/versions.txt ]; then
            echo "::error::No launcher release found on upstream"
            exit 1
          fi
          echo "upstream launcher releases, newest first:"
          head -5 /tmp/versions.txt | sed 's/^/  /'
          head -10 /tmp/versions.txt > /tmp/candidates.txt
          git remote add upstream https://github.com/horizon-rust/horizon.git
          mkdir -p /tmp/patches
          cp offline/patches/*.patch /tmp/patches/
          phash=$(cat /tmp/patches/*.patch offline/lang-sync.py offline/lang-overrides.json .github/workflows/launcher-release.yml | sha256sum | cut -c1-8)
          echo "patch set hash (phash): ${phash}; it changes whenever a patch, the offline lang data or launcher-release.yml changes"
          newest=$(head -1 /tmp/candidates.txt)
          alert=""
          chosen=""
          while IFS= read -r version; do
            [ -z "$version" ] && continue
            target="launcher@${version}-offline"
            marker="offline-failed/${version}-${phash}"
            if gh release view "$target" -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null | grep -qF "offline-phash:${phash}"; then
              echo "already released: ${target} with this exact patch set (offline-phash:${phash}); every older upstream version is covered by it"
              break
            fi
            # A release published from an older patch set (its body carries no matching
            # offline-phash) does not cover the current patches: fall through and rebuild
            # the same version. The publish step replaces the release, so the new assets
            # take the old ones' place under the same tag.
            if [ "${RETRY:-}" != true ] && git ls-remote --exit-code --tags origin "refs/tags/${marker}" >/dev/null 2>&1; then
              echo "skipping ${version}: the marker tag ${marker} says it already failed with these patches and workflows; change them, or run this workflow with retry"
              continue
            fi
            refname=$(git ls-remote upstream "refs/tags/launcher@${version}" "refs/tags/launcher-v${version}" \
              | cut -f2 | grep -v '\^{}$' | head -1)
            if [ -z "$refname" ]; then
              echo "::warning::no upstream tag for version ${version}, skipping"
              continue
            fi
            echo "::group::trying upstream ${version} (${refname})"
            git am --abort >/dev/null 2>&1 || true
            git reset --hard >/dev/null 2>&1 || true
            git clean -fdq >/dev/null 2>&1 || true
            # Blobs, not just commits and trees: git am --3way rebuilds the patch's base
            # from them ("sha1 information is lacking or useless" otherwise). --depth=1
            # keeps it light while still carrying the tip tree's blobs.
            git fetch --depth=1 upstream "$refname" --no-tags
            sha=$(git rev-parse "FETCH_HEAD^{commit}")
            git checkout -B attempt "$sha"
            ok=true
            failed_patch=""
            for p in /tmp/patches/*.patch; do
              echo "git am $(basename "$p")"
              if ! git am "$p" 2>/tmp/am-fallback.log; then
                # A plain apply fails when the context drifted. --3way can still merge it,
                # but only when the patch's base blobs are in this checkout (they are
                # missing for intermediate patch states), so fall back before giving up.
                git am --abort >/dev/null 2>&1 || true
                if ! git am --3way "$p" 2>>/tmp/am-fallback.log; then
                  failed_patch="$(basename "$p")"
                  ok=false
                  break
                fi
              fi
            done
            echo "::endgroup::"
            if [ "$ok" != true ]; then
              conflicted=$(git diff --name-only --diff-filter=U || true)
              echo "::warning::offline/patches do not apply to upstream ${version} (the first patch that failed: ${failed_patch:-unknown}); trying the next older release"
              {
                echo "### git am failed while applying offline/patches to upstream ${version}"
                echo
                echo "- upstream ref: \`${refname}\`"
                echo "- the first patch that failed: \`offline/patches/${failed_patch:-unknown}\`"
                echo
                echo "<details open><summary>Conflicted files</summary>"
                echo
                echo '```'
                if [ -n "$conflicted" ]; then printf '%s\n' "$conflicted"; else echo "(git am reported no unmerged paths: often a missing base blob or a deleted file; read the git am output above)"; fi
                echo '```'
                echo '</details>'
                echo
                echo "<details open><summary>The failing patch (git am --show-current-patch)</summary>"
                echo
                echo '```diff'
                git am --show-current-patch=diff 2>/dev/null | head -120 || true
                echo '```'
                echo '</details>'
                echo
                echo "Rebase \`offline/patches/${failed_patch:-the failing patch}\` onto \`${refname}\` and push the new patch files."
              } >> "$GITHUB_STEP_SUMMARY" || true
              git push origin "origin/main:refs/tags/${marker}" >/dev/null 2>&1 || true
              if [ "$version" = "$newest" ]; then
                alert="offline/patches do not apply to upstream ${version}: the first patch that failed is offline/patches/${failed_patch:-unknown}; conflicted files: $(printf '%s' "$conflicted" | tr '\n' ' ')"
                {
                  echo "Upstream launcher ${version} was released and offline/patches do not apply to it."
                  echo
                  echo "- the first patch that failed: \`offline/patches/${failed_patch:-unknown}\`"
                  echo "- conflicted files:"
                  echo '```'
                  if [ -n "$conflicted" ]; then printf '%s\n' "$conflicted"; else echo "none reported (see the run summary)"; fi
                  echo '```'
                  echo
                  echo "Rebase them onto launcher@${version} and upload them again. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                } > /tmp/issue-body.md
                gh issue create -R "$GITHUB_REPOSITORY" \
                  --title "Offline patches do not apply to upstream ${version}" \
                  --body-file /tmp/issue-body.md \
                  >/dev/null 2>&1 || true
              fi
              git am --abort >/dev/null 2>&1 || true
              continue
            fi
            chosen="$version"
            break
          done < /tmp/candidates.txt
          echo "alert=${alert}" >> "$GITHUB_OUTPUT"
          if [ -z "$chosen" ]; then
            echo "::notice::nothing to build: the newest upstream release is already published, or every pending one is recorded as failed. If a newer upstream release stays unbuilt, rebase offline/patches/ onto it."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "building offline release from upstream ${chosen}"
          mkdir -p .github/workflows
          find .github/workflows -type f \
            ! -name launcher-release.yml ! -name auto-offline-release.yml -delete
          git show origin/main:.github/workflows/launcher-release.yml > .github/workflows/launcher-release.yml
          git show origin/main:.github/workflows/auto-offline-release.yml > .github/workflows/auto-offline-release.yml
          git checkout origin/main -- offline/patches
          # The fork's own files must survive this CI commit: main's README replaces
          # upstream's, and every file main has but the patched upstream tree does not
          # (fork screenshots like docs/media/offline-*.png, offline/verify-release.py,
          # extra workflow files) comes back from main. Without this, each release
          # commit resets the README to upstream's and drops fork-only files.
          git checkout origin/main -- README.md || true
          comm -23 \
            <(git ls-tree -r --name-only origin/main | sort) \
            <(git ls-tree -r --name-only HEAD | sort) \
            | while IFS= read -r f; do git checkout origin/main -- "$f"; done
          pub=$(printf '%s' "$RELEASE_SIGNING_KEY" | base64 --decode \
            | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64)
          grep -qx "$pub" crates/horizon-release-sign/release-keys.txt || {
            echo "::error::RELEASE_SIGNING_KEY does not match any key in crates/horizon-release-sign/release-keys.txt: update the secret or the key inside offline/patches/0003-offline-update-notice.patch"
            exit 1
          }
          # The language tables are not patched: lang-sync drops the removed
          # strings' keys and adds the offline card's key to every table, in
          # upstream's own JSON layout (see offline/lang-sync.py).
          python3 offline/lang-sync.py
          git add -A .
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse 'origin/main^{tree}')" ]; then
            echo "main already holds upstream ${chosen} with the offline patches, skipping the main push"
            git checkout -q -B attempt origin/main
            needs_push=false
          else
            commit=$(git commit-tree "$tree" -p origin/main \
              -m "CI: offline release from upstream ${chosen}" \
              -m "Upstream launcher@${chosen} with offline/patches applied, built by auto-offline-release.")
            git checkout -q -B attempt "$commit"
            needs_push=true
          fi
          target="launcher@${chosen}-offline"
          git tag -f "$target"
          if [ "$needs_push" = true ]; then
            git push origin HEAD:refs/heads/main \
              || { sleep 8; git push origin HEAD:refs/heads/main; } \
              || {
                echo "::error::could not push main; the next run will retry, no build starts on an unpushed tree"
                exit 1
              }
          fi
          git push --force origin "refs/tags/${target}" \
            || { sleep 8; git push --force origin "refs/tags/${target}"; }
          echo "tag=${target}" >> "$GITHUB_OUTPUT"
          echo "marker=offline-failed/${chosen}-${phash}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "should_build=true" >> "$GITHUB_OUTPUT"

  build:
    name: offline build
    needs: sync
    if: needs.sync.outputs.should_build == 'true'
    uses: ./.github/workflows/launcher-release.yml
    with:
      ref: ${{ needs.sync.outputs.tag }}
    secrets: inherit

  alert:
    name: patches need a rebase
    needs: sync
    if: needs.sync.outputs.alert != ''
    runs-on: ubuntu-24.04
    steps:
      - name: Fail the run so GitHub notifies you
        env:
          ALERT: ${{ needs.sync.outputs.alert }}
        run: |
          echo "::error::${ALERT}"
          exit 1

  remember-failure:
    name: remember the failed build
    needs: [sync, build]
    if: ${{ always() && needs.build.result == 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Stop retrying this version and explain what broke
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: ${{ needs.sync.outputs.marker }}
          SHA: ${{ needs.sync.outputs.sha }}
          TAG: ${{ needs.sync.outputs.tag }}
        run: |
          # Only mark the version as failed when the build itself failed. A job that
          # GitHub could not even place on a hosted runner ("The job was not acquired
          # by Runner of type hosted") never runs a single step, and the run can also
          # die on a GitHub "Internal server error". Those are GitHub capacity/infra
          # failures, not ours: do not record the marker, so the next cron run retries
          # the same version automatically.
          real_failure=false
          while IFS=$'\t' read -r job_name step_count; do
            if [ "${step_count:-0}" -gt 0 ]; then
              real_failure=true
              echo "  ${job_name}: failed after ${step_count} step(s) ran"
            else
              echo "::notice::${job_name} never acquired a hosted runner and ran 0 steps: transient GitHub capacity/infra failure, this will be retried"
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | [.name, (.steps | length)] | @tsv' \
            || true)
          if [ "$real_failure" != true ]; then
            echo "::notice::no failing job ran any step: the run died on runner acquisition or a GitHub internal error. ${TAG} is NOT marked as failed; the next scheduled run rebuilds it."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${MARKER}" -f "sha=${SHA}" >/dev/null || true
          # The failed steps' logs can still be empty right after the job ends (GitHub
          # finalizes them a moment later); retry a few times before giving up, so the
          # issue actually carries the error instead of a log-less shell.
          failed_log=""
          for attempt in 1 2 3 4; do
            failed_log="$(gh run view "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" --log-failed 2>/dev/null | tail -120 || true)"
            [ -n "$failed_log" ] && break
            sleep 20
          done
          {
            echo "The build of ${TAG} failed."
            echo
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -n "$failed_log" ]; then
              echo "<details open><summary>The failed steps' log (last 120 lines)</summary>"
              echo
              echo '```'
              printf '%s\n' "$failed_log"
              echo '```'
              echo '</details>'
              echo
            fi
            echo "It will not be retried until offline/patches or the workflows change, or this workflow is run with retry."
            echo "The build job's summary and its test-log/build-log artifacts hold the full panic messages."
          } > /tmp/issue-body.md
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Offline build failed: ${TAG}" \
            --body-file /tmp/issue-body.md \
            >/dev/null 2>&1 || true

  cleanup-failed:
    name: delete stale offline-failed markers
    needs: [sync, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete old offline-failed markers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/offline-failed" --jq '.[].ref' \
            | sed 's|^refs/tags/||; s|/|%2F|g' \
            | while read -r tag; do
                echo "Deleting $tag"
                gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
              done
